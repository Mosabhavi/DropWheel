name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" ./build-app.sh
          ditto -c -k --sequesterRsrc --keepParent DropWheel.app "DropWheel-$VERSION.zip"
          echo "ZIP=DropWheel-$VERSION.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DropWheel
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
